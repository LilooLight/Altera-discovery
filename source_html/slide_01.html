<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>МИС Альтера — Бренд-бук</title>
<link rel="stylesheet" href="global.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  .cover-slide {
    background-image: url("bg_cover.jpg");
    background-size: cover;
    background-position: center;
  }
  .cover-overlay {
    background: linear-gradient(180deg, rgba(26,31,46,0.15) 0%, rgba(26,31,46,0.55) 100%);
  }
  .logo-circle {
    width: 180px;
    height: 180px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-circle .material-icons {
    font-size: 96px;
    color: #5ECEC1;
  }
  .eyebrow-cover {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    color: #F5EFE6;
    opacity: 0.85;
    text-transform: uppercase;
    font-weight: 500;
  }
  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    letter-spacing: 0.4em;
    color: #FFFFFF;
    font-weight: 600;
  }
  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: 56px;
    color: #FFFFFF;
    line-height: 1.1;
    text-align: center;
    font-weight: 700;
  }
  .hero-subtitle {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-style: italic;
    font-size: 22px;
    color: #F5EFE6;
    opacity: 0.9;
    text-align: center;
  }
  .divider-line {
    width: 80px;
    height: 1px;
    background: rgba(94,206,193,0.6);
    margin: 0 auto;
  }
  .footer-credit {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #F5EFE6;
    opacity: 0.7;
    text-align: center;
  }
</style>
</head>
<body>
<div class="slide cover-slide" style="position: relative;">
  <!-- Dark gradient overlay -->
  <div class="cover-overlay" data-decor aria-hidden="true" style="position: absolute; inset: 0; z-index: 1;"></div>

  <!-- Centered content -->
  <div style="position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 60px 80px;">

    <!-- Top eyebrow -->
    <div class="eyebrow-cover">BRAND BOOK · 2026</div>

    <!-- Logo circle + brand name -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px;">
      <div class="logo-circle">
        <span class="material-icons">autorenew</span>
      </div>
      <div class="brand-name">АЛЬТЕРА</div>
    </div>

    <!-- Hero title -->
    <h1 class="hero-title">МИС Альтера. Бренд-бук.</h1>

    <!-- Subtitle -->
    <div class="hero-subtitle">Технологии, которые заботятся.</div>

  </div>

  <!-- Bottom footer credit -->
  <div style="position: absolute; bottom: 56px; left: 0; right: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div class="divider-line" data-decor aria-hidden="true"></div>
    <div class="footer-credit">Отдел дизайна и маркетинга</div>
  </div>
</div>
</body>
</html>
