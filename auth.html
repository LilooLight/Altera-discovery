<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Альтера — Вход в систему</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { font-size: 16px; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: rgba(75, 85, 99, 1);
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== BACKGROUND LAYERS ===== */
    .bg-image-layer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      background-color: #fff;
      background-image: url('https://images.nightcafe.studio/jobs/bH1uQjDLpgJ2zx9tujeB/bH1uQjDLpgJ2zx9tujeB--0--_8gV8_6x-real-esrgan-x4-plus.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.25;
    }

    .biomorph-layer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .biomorph-shape {
      position: absolute;
      will-change: transform, opacity;
    }

    .noise-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.035;
    }

    /* ===== MAIN CONTAINER ===== */
    .auth-container {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    /* ===== AUTH CARD ===== */
    .auth-card {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08), 0 16px 64px rgba(48, 66, 65, 0.2);
      backdrop-filter: blur(16.67px);
      -webkit-backdrop-filter: blur(16.67px);
      display: flex;
      width: 100%;
      max-width: 1224px;
      height: 814px;
      overflow: hidden;
    }

    /* ===== LEFT PANEL ===== */
    .auth-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 64px 56px;
      position: relative;
    }

    /* ===== TOP: Brand block (always visible, left-aligned) ===== */
    .brand-block {
      flex-shrink: 0;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      background: none;
      border-radius: 0;
    }

    .brand-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 68px;
      font-weight: 700;
      color: rgba(75, 85, 99, 1);
      line-height: 82px;
    }

    .brand-subtitle {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: 22px;
      color: rgba(75, 85, 99, 1);
      margin-top: 0.5rem;
      line-height: 24px;
    }

    /* ===== MIDDLE: Login form (appears after splash) ===== */
    .middle-area {
      flex: 1;
      display: flex;
      align-items: flex-start;
      padding-top: 2.5rem;
    }

    .login-form {
      width: 82%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
    }

    .login-form.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(75, 85, 99, 1);
    }

    .form-group input {
      padding: 0.7rem 0.9rem;
      font-size: 0.9rem;
      font-family: inherit;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      color: rgba(75, 85, 99, 1);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input::placeholder { color: #cbd5e1; }

    .form-group input:focus {
      border-color: #5ECEC1;
      box-shadow: 0 0 0 3px rgba(94, 206, 193, 0.15);
    }

    .btn-login {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.8rem;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: linear-gradient(135deg, #5ECEC1 0%, #0CAE9B 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 3px 12px rgba(94, 206, 193, 0.3);
      margin-top: 0.5rem;
      align-self: flex-start;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 20px rgba(94, 206, 193, 0.4);
    }
    .btn-login:active { transform: translateY(0); }

    /* ===== BOTTOM: Footer (always pinned to bottom) ===== */
    .auth-footer {
      flex-shrink: 0;
      transition: margin-top 0.6s ease 0.3s;
    }

    .auth-footer.at-bottom {
      margin-top: auto;
    }

    .footer-org {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: rgba(75, 85, 99, 1);
      letter-spacing: 0.005em;
      line-height: 16px;
      margin-bottom: 0.6rem;
    }

    .footer-legal {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: rgba(156, 163, 175, 1);
      letter-spacing: -0.02em;
      line-height: 16px;
      margin-bottom: 0.75rem;
    }

    .footer-legal a {
      color: rgba(59, 130, 246, 1);
      text-decoration: underline;
      }
    .footer-legal a:hover { text-decoration: underline; }

    /* Progress line (text + bar) */
    .progress-line {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.4s ease, max-height 0.6s ease 0.2s;
      max-height: 80px;
      overflow: hidden;
    }

    .progress-line.hiding {
      opacity: 0;
      max-height: 0;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0;
    }

    .progress-label {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: rgba(75, 85, 99, 1);
      letter-spacing: -0.02em;
      line-height: 16px;
      white-space: nowrap;
    }

    .progress-status {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: rgba(156, 163, 175, 1);
      letter-spacing: -0.02em;
      line-height: 16px;
    }

    .progress-bar-track {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: rgba(0, 6, 16, 0.06);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5ECEC1, #3BEFF6);
      border-radius: 100px;
      transition: width 0.3s ease;
    }

    .progress-percent {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: rgba(0, 6, 16, 0.85);
      line-height: 22px;
      white-space: nowrap;
    }

    .auth-right::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(94,206,193,0.12) 0%, rgba(71,220,255,0.08) 100%);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      body { overflow: auto; }
      .bg-image-layer { display: none; }
      .biomorph-layer { display: none; }
      .noise-overlay { display: none; }
      .auth-card {
        max-width: 100%;
        height: auto;
        min-height: 100vh;
        border-radius: 0;
        box-shadow: none;
      }
      .auth-right {
        display: none;
      }
      .auth-left {
        padding: 48px 24px 40px 24px;
      }
      .brand-logo { width: 48px; height: 48px; margin-bottom: 0.75rem; }
      .brand-name { font-size: 48px; line-height: 58px; }
      .brand-subtitle { font-size: 18px; line-height: 20px; margin-top: 0.4rem; }
      .middle-area { padding-top: 1.75rem; }
      .form-group label { font-size: 0.78rem; }
      .form-group input { padding: 0.6rem 0.8rem; font-size: 0.85rem; }
      .btn-login { padding: 0.6rem 1.5rem; font-size: 0.85rem; }
      .footer-org { font-size: 13px; }
      .footer-legal { font-size: 11px; }
      .progress-label, .progress-status { font-size: 13px; }
      .progress-bar { height: 6px; }
      .progress-percent { font-size: 13px; }
      .login-form { width: 100%; }
    }

    @media (max-width: 480px) {
      .auth-left { padding: 36px 20px 28px 20px; }
      .brand-logo { width: 40px; height: 40px; margin-bottom: 0.6rem; }
      .brand-name { font-size: 40px; line-height: 48px; }
      .brand-subtitle { font-size: 16px; line-height: 18px; margin-top: 0.3rem; }
      .middle-area { padding-top: 1.25rem; }
      .form-group label { font-size: 0.75rem; }
      .form-group input { padding: 0.55rem 0.7rem; font-size: 0.82rem; }
      .btn-login { padding: 0.55rem 1.2rem; font-size: 0.82rem; }
      .footer-org { font-size: 12px; }
      .footer-legal { font-size: 10px; }
      .progress-label, .progress-status { font-size: 12px; }
      .progress-bar { height: 5px; }
      .progress-percent { font-size: 12px; }
    }

    /* ===== ACCESSIBILITY ===== */
    @media (prefers-reduced-motion: reduce) {
      .login-form, .progress-line { transition: none; }
      .biomorph-shape { opacity: 0 !important; }
    }

    *:focus-visible {
      outline: 2px solid #5ECEC1;
      outline-offset: 2px;
    }
  </style>
</head>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    (function () {
      'use strict';

      // ===== BIOMORPH ANIMATIONS =====
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var shapes = document.querySelectorAll('.biomorph-shape');
        var paths = [
          [{x: 500, y: -200, d: 5}, {x: 300, y: 350, d: 4}, {x: -450, y: 250, d: 6}, {x: -300, y: -350, d: 5}, {x: 0, y: 0, d: 4}],
          [{x: -400, y: -300, d: 6}, {x: 450, y: -150, d: 4}, {x: 350, y: 400, d: 5}, {x: -350, y: 250, d: 7}, {x: 0, y: 0, d: 5}],
          [{x: 600, y: 150, d: 7}, {x: -150, y: -350, d: 5}, {x: -550, y: -100, d: 6}, {x: 200, y: 400, d: 4}, {x: 0, y: 0, d: 5}],
          [{x: -200, y: -450, d: 5}, {x: 350, y: 150, d: 6}, {x: 250, y: 500, d: 7}, {x: -400, y: -100, d: 4}, {x: 0, y: 0, d: 5}],
          [{x: 400, y: 250, d: 6}, {x: -300, y: 350, d: 5}, {x: -400, y: -250, d: 4}, {x: 300, y: -350, d: 7}, {x: 0, y: 0, d: 5}],
          [{x: 450, y: -300, d: 5}, {x: -200, y: -400, d: 4}, {x: -500, y: 300, d: 6}, {x: 350, y: 200, d: 5}, {x: 0, y: 0, d: 4}]
        ];
        shapes.forEach(function (shape, i) {
          var path = paths[i % paths.length];
          var tl = gsap.timeline({repeat: -1});
          path.forEach(function (wp) {
            tl.to(shape, {x: wp.x, y: wp.y, duration: wp.d, ease: 'sine.inOut'});
          });
        });
      }

      // ===== BOOT SEQUENCE =====
      var progressFill   = document.getElementById('progressFill');
      var progressStatus = document.getElementById('progressStatus');
      var progressPercent = document.getElementById('progressPercent');
      var progressLine   = document.getElementById('progressLine');
      var loginForm      = document.getElementById('loginForm');
      var brandLogo      = document.getElementById('brandLogo');
      var authFooter     = document.querySelector('.auth-footer');

      var statusMessages = [
        'Выполняется интеграция с CRM...',
        'Загрузка модуля расписания...',
        'Синхронизация справочников...',
        'Проверка лицензии...',
        'Инициализация интерфейса...'
      ];

      var msgInterval = null;
      var progressDuration = 10000; // 10 seconds — realistic for prototype
      var startTime = null;
      var animFrame = null;

      function runBoot() {
        // Reset state
        clearInterval(msgInterval);
        cancelAnimationFrame(animFrame);
        startTime = null;

        // Reset UI
        progressFill.style.width = '0%';
        progressPercent.textContent = '0%';
        progressStatus.textContent = statusMessages[0];
        progressLine.classList.remove('hiding');
        loginForm.classList.remove('visible');
        authFooter.classList.remove('at-bottom');

        var msgIndex = 0;
        msgInterval = setInterval(function () {
          msgIndex++;
          if (msgIndex < statusMessages.length) {
            progressStatus.textContent = statusMessages[msgIndex];
          }
        }, 2000);

        setTimeout(function () {
          requestAnimationFrame(animateProgress);
        }, 400);
      }

      function animateProgress(timestamp) {
        if (!startTime) startTime = timestamp;
        var elapsed = timestamp - startTime;
        var raw = Math.min(elapsed / progressDuration, 1);
        var progress = 1 - Math.pow(1 - raw, 3);
        var pct = Math.round(progress * 100);
        progressFill.style.width = pct + '%';
        progressPercent.textContent = pct + '%';

        if (raw < 1) {
          animFrame = requestAnimationFrame(animateProgress);
        } else {
          clearInterval(msgInterval);
          transitionToLogin();
        }
      }

      function transitionToLogin() {
        progressLine.classList.add('hiding');
        authFooter.classList.add('at-bottom');
        setTimeout(function () {
          loginForm.classList.add('visible');
        }, 500);
      }

      // Click logo to restart
      brandLogo.addEventListener('click', function () {
        runBoot();
      });

      // Initial run
      runBoot();

    })();
  </script>
