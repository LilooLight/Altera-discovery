<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Альтера — Вход в систему</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { font-size: 16px; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: rgba(75, 85, 99, 1);
      min-height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== BACKGROUND LAYERS ===== */
    .bg-image-layer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      background-color: #fff;
      background-image: url('https://images.nightcafe.studio/jobs/bH1uQjDLpgJ2zx9tujeB/bH1uQjDLpgJ2zx9tujeB--0--_8gV8_6x-real-esrgan-x4-plus.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.25;
    }

    .biomorph-layer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .biomorph-shape {
      position: absolute;
      will-change: transform, opacity;
    }

    .noise-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 2;
      pointer-events: none;
      opacity: 0.035;
    }

    /* ===== MAIN CONTAINER ===== */
    .auth-container {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    /* ===== AUTH CARD ===== */
    .auth-card {
      background: rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08), 0 16px 64px rgba(48, 66, 65, 0.2);
      backdrop-filter: blur(16.67px);
      -webkit-backdrop-filter: blur(16.67px);
      display: flex;
      width: 100%;
      max-width: 1224px;
      height: 814px;
      overflow: hidden;
    }

    /* ===== LEFT PANEL ===== */
    .auth-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 64px 56px;
      position: relative;
    }

    /* ===== TOP: Brand block (always visible, left-aligned) ===== */
    .brand-block {
      flex-shrink: 0;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      margin-bottom: 1rem;
      background: none;
      border-radius: 0;
    }

    .brand-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 76px;
      font-weight: 700;
      color: rgba(75, 85, 99, 1);
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .brand-subtitle {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: 22px;
      color: rgba(75, 85, 99, 1);
      letter-spacing: -1px;
      margin-top: 0.5rem;
      line-height: 24px;
    }

    /* ===== MIDDLE: Login form (appears after splash) ===== */
    .middle-area {
      flex: 1;
      display: flex;
      align-items: flex-start;
      padding-top: 2.5rem;
    }

    .login-form {
      width: 82%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
    }

    .login-form.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(75, 85, 99, 1);
    }

    .form-group input {
      padding: 0.7rem 0.9rem;
      font-size: 0.9rem;
      font-family: inherit;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
      color: rgba(75, 85, 99, 1);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input::placeholder { color: #cbd5e1; }

    .form-group input:focus {
      border-color: #5ECEC1;
      box-shadow: 0 0 0 3px rgba(94, 206, 193, 0.15);
    }

    .btn-login {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 1.8rem;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: linear-gradient(135deg, #5ECEC1 0%, #0CAE9B 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 3px 12px rgba(94, 206, 193, 0.3);
      margin-top: 0.5rem;
      align-self: flex-start;
    }

    .btn-login:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 20px rgba(94, 206, 193, 0.4);
    }
    .btn-login:active { transform: translateY(0); }

    /* ===== BOTTOM: Footer (always pinned to bottom) ===== */
    .auth-footer {
      flex-shrink: 0;
      transition: margin-top 0.6s ease 0.3s;
    }

    .auth-footer.at-bottom {
      margin-top: auto;
    }

    .footer-org {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: rgba(75, 85, 99, 1);
      letter-spacing: 0.005em;
      line-height: 16px;
      margin-bottom: 0.6rem;
    }

    .footer-legal {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 400;
      color: rgba(156, 163, 175, 1);
      letter-spacing: -0.02em;
      line-height: 16px;
      margin-bottom: 0.75rem;
    }

    .footer-legal a {
      color: rgba(59, 130, 246, 1);
      text-decoration: underline;
      }
    .footer-legal a:hover { text-decoration: underline; }

    /* Progress line (text + bar) */
    .progress-line {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.4s ease, max-height 0.6s ease 0.2s;
      max-height: 80px;
      overflow: hidden;
    }

    .progress-line.hiding {
      opacity: 0;
      max-height: 0;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0;
    }

    .progress-label {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: rgba(75, 85, 99, 1);
      letter-spacing: -0.02em;
      line-height: 16px;
      white-space: nowrap;
    }

    .progress-status {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: rgba(156, 163, 175, 1);
      letter-spacing: -0.02em;
      line-height: 16px;
    }

    .progress-bar-track {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: rgba(0, 6, 16, 0.06);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5ECEC1, #3BEFF6);
      border-radius: 100px;
      transition: width 0.3s ease;
    }

    .progress-percent {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: rgba(0, 6, 16, 0.85);
      line-height: 22px;
      white-space: nowrap;
    }

                                <path d="M5.89409 13.7047C2.92763 17.0465 4.57764e-05 25.4029 4.57764e-05 31.8128C4.57764e-05 49.4859 14.3516 63.8128 32.0552 63.8128C38.3407 63.8128 44.203 62.0073 49.1512 58.8868L49.1513 58.8867C49.1652 58.8525 33.3489 52.3702 30.3365 50.8408C23.2067 47.2209 14.3399 42.4511 10.0529 38.647C5.31167 34.4398 4.31009 31.9825 4.31009 29.5665C4.31009 29.0479 4.35623 26.25 4.42145 25.665C4.42145 25.665 5.58997 28.9327 10.8956 33.977C16.1859 39.0067 36.5158 49.402 53.5396 55.562C55.3441 53.9342 56.996 52.1043 58.4084 50.1082C61.3748 46.7664 64.3024 38.4099 64.3024 32C64.3024 14.3269 49.9508 0 32.2472 0C25.9617 0 20.0994 1.80556 15.1512 4.92606L15.1512 4.92612C15.1373 4.96028 30.9535 11.4426 33.966 12.9721C41.0957 16.592 49.9625 21.3617 54.2496 25.1659C58.9908 29.373 59.9924 31.8303 59.9924 34.2463C59.9924 34.7649 59.9462 37.5628 59.881 38.1478C59.881 38.1478 58.7125 34.8801 53.4068 29.8358C48.1165 24.8061 27.7866 14.4108 10.7628 8.25082C8.95835 9.87862 7.30645 11.7085 5.89409 13.7047ZM5.38617 16.0041C6.15195 25.9234 20.1557 34.0949 28.7808 38.2519C42.2487 44.3283 56.2286 47.2906 58.9163 47.8087C58.1505 37.8895 44.1467 29.7179 35.5217 25.561C22.0538 19.4845 8.07383 16.5223 5.38617 16.0041ZM58.2813 22.728C54.4666 12.053 44.2509 4.4138 32.2472 4.4138Q29.5282 4.4138 26.9095 4.92566L26.9094 4.92568L26.9075 4.92606L26.9074 4.92608C34.7438 7.5238 41.8466 11.2333 47.9674 14.7882C54.2495 18.4367 58.2813 22.728 58.2813 22.728ZM6.02111 41.0849C9.83589 51.7599 20.0515 59.399 32.0552 59.399Q34.7743 59.399 37.3929 58.8872L37.3931 58.8871L37.395 58.8868L37.3951 58.8868C29.5586 56.289 22.4558 52.5795 16.335 49.0246C10.053 45.3761 6.02117 41.0848 6.02111 41.0849Z" fill="#0CAE9B" fill-rule="evenodd" />

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script>
    (function () {
      'use strict';

      // ===== BIOMORPH ANIMATIONS =====
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var shapes = document.querySelectorAll('.biomorph-shape');
        var paths = [
          [{x: 500, y: -200, d: 5}, {x: 300, y: 350, d: 4}, {x: -450, y: 250, d: 6}, {x: -300, y: -350, d: 5}, {x: 0, y: 0, d: 4}],
          [{x: -400, y: -300, d: 6}, {x: 450, y: -150, d: 4}, {x: 350, y: 400, d: 5}, {x: -350, y: 250, d: 7}, {x: 0, y: 0, d: 5}],
          [{x: 600, y: 150, d: 7}, {x: -150, y: -350, d: 5}, {x: -550, y: -100, d: 6}, {x: 200, y: 400, d: 4}, {x: 0, y: 0, d: 5}],
          [{x: -200, y: -450, d: 5}, {x: 350, y: 150, d: 6}, {x: 250, y: 500, d: 7}, {x: -400, y: -100, d: 4}, {x: 0, y: 0, d: 5}],
          [{x: 400, y: 250, d: 6}, {x: -300, y: 350, d: 5}, {x: -400, y: -250, d: 4}, {x: 300, y: -350, d: 7}, {x: 0, y: 0, d: 5}],
          [{x: 450, y: -300, d: 5}, {x: -200, y: -400, d: 4}, {x: -500, y: 300, d: 6}, {x: 350, y: 200, d: 5}, {x: 0, y: 0, d: 4}]
        ];
        shapes.forEach(function (shape, i) {
          var path = paths[i % paths.length];
          var tl = gsap.timeline({repeat: -1});
          path.forEach(function (wp) {
            tl.to(shape, {x: wp.x, y: wp.y, duration: wp.d, ease: 'sine.inOut'});
          });
        });
      }

      // ===== BOOT SEQUENCE =====
      var progressFill   = document.getElementById('progressFill');
      var progressStatus = document.getElementById('progressStatus');
      var progressPercent = document.getElementById('progressPercent');
      var progressLine   = document.getElementById('progressLine');
      var loginForm      = document.getElementById('loginForm');
      var brandLogo      = document.getElementById('brandLogo');
      var authFooter     = document.querySelector('.auth-footer');

      var statusMessages = [
        'Выполняется интеграция с CRM...',
        'Загрузка модуля расписания...',
        'Синхронизация справочников...',
        'Проверка лицензии...',
        'Инициализация интерфейса...'
      ];

      var msgInterval = null;
      var progressDuration = 10000; // 10 seconds — realistic for prototype
      var startTime = null;
      var animFrame = null;

      function runBoot() {
        // Reset state
        clearInterval(msgInterval);
        cancelAnimationFrame(animFrame);
        startTime = null;

        // Reset UI
        progressFill.style.width = '0%';
        progressPercent.textContent = '0%';
        progressStatus.textContent = statusMessages[0];
        progressLine.classList.remove('hiding');
        loginForm.classList.remove('visible');
        authFooter.classList.remove('at-bottom');

        var msgIndex = 0;
        msgInterval = setInterval(function () {
          msgIndex++;
          if (msgIndex < statusMessages.length) {
            progressStatus.textContent = statusMessages[msgIndex];
          }
        }, 2000);

        setTimeout(function () {
          requestAnimationFrame(animateProgress);
        }, 400);
      }

      function animateProgress(timestamp) {
        if (!startTime) startTime = timestamp;
        var elapsed = timestamp - startTime;
        var raw = Math.min(elapsed / progressDuration, 1);
        var progress = 1 - Math.pow(1 - raw, 3);
        var pct = Math.round(progress * 100);
        progressFill.style.width = pct + '%';
        progressPercent.textContent = pct + '%';

        if (raw < 1) {
          animFrame = requestAnimationFrame(animateProgress);
        } else {
          clearInterval(msgInterval);
          transitionToLogin();
        }
      }

      function transitionToLogin() {
        progressLine.classList.add('hiding');
        authFooter.classList.add('at-bottom');
        setTimeout(function () {
          loginForm.classList.add('visible');
        }, 500);
      }

      // Click logo to restart
      brandLogo.addEventListener('click', function () {
        runBoot();
      });

      // Initial run
      runBoot();

    })();
  </script>
